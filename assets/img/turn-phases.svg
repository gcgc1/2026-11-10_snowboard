<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="tp-title tp-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="tp-title">The three phases of a turn and the fall line</title>
  <desc id="tp-desc">Top view of a slope. A dashed vertical fall line runs down the middle. An S-shaped track shows a rider descending: initiation where the edge is released and the body crosses the board, control as the board passes through the fall line, completion as the board finishes across the slope. A second turn repeats the pattern.</desc>

  <defs>
    <marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="860" height="390" rx="12" fill="#f7fafc" stroke="#dde5ec" stroke-width="1.5"/>

  <text x="40" y="54" font-size="12" fill="#4a5a6a">uphill</text>
  <text x="40" y="408" font-size="12" fill="#4a5a6a">downhill</text>

  <!-- fall line -->
  <line x1="450" y1="66" x2="450" y2="404" stroke="#4a5a6a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="450" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5a6a">fall line</text>

  <!-- S track -->
  <path d="M250,90 Q450,300 650,210 Q450,420 250,330" fill="none" stroke="#1f6feb" stroke-width="3.2" stroke-linecap="round" marker-end="url(#tp-arrow)"/>

  <!-- 1 initiation -->
  <circle cx="250" cy="90" r="6" fill="#1f6feb"/>
  <line x1="244" y1="90" x2="150" y2="90" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="146" y="86" text-anchor="end" font-size="14" font-weight="700" fill="#17202a">1 · Initiation</text>
  <text x="146" y="104" text-anchor="end" font-size="12" fill="#4a5a6a">release the old edge,</text>
  <text x="146" y="120" text-anchor="end" font-size="12" fill="#4a5a6a">cross over the board</text>

  <!-- 2 control -->
  <circle cx="450" cy="195" r="6" fill="#1f6feb"/>
  <line x1="462" y1="195" x2="560" y2="188" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="566" y="184" font-size="14" font-weight="700" fill="#17202a">2 · Control</text>
  <text x="566" y="202" font-size="12" fill="#4a5a6a">board passes through</text>
  <text x="566" y="218" font-size="12" fill="#4a5a6a">the fall line</text>

  <!-- 3 completion -->
  <circle cx="650" cy="210" r="6" fill="#1f6feb"/>
  <line x1="662" y1="210" x2="730" y2="210" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="736" y="206" font-size="14" font-weight="700" fill="#17202a">3 · Completion</text>
  <text x="736" y="224" font-size="12" fill="#4a5a6a">finish across the slope</text>

  <text x="690" y="392" text-anchor="end" font-size="12" fill="#4a5a6a" font-style="italic">link them and you get the S-turn</text>
</svg>
