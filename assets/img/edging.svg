<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="ed-t ed-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ed-t">Edge angle controls grip</title>
  <desc id="ed-d">Front view of a board on snow at three edge angles: flat, which slides; moderately edged, which grips; and hard edged, which brakes.</desc>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#17202a">Edge angle is the grip dial — tilt the board further onto its edge to slow down</text>

  <line x1="60" y1="40" x2="60" y2="270" stroke="#dde5ec" stroke-width="1"/>
  <line x1="360" y1="40" x2="360" y2="270" stroke="#dde5ec" stroke-width="1"/>
  <line x1="660" y1="40" x2="660" y2="270" stroke="#dde5ec" stroke-width="1"/>

  <!-- flat -->
  <g>
    <line x1="55" y1="210" x2="245" y2="210" stroke="#dde5ec" stroke-width="3"/>
    <text x="30" y="214" font-size="11" fill="#4a5a6a">snow</text>
    <line x1="85" y1="206" x2="215" y2="206" stroke="#17202a" stroke-width="10" stroke-linecap="round"/>
    <text x="150" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#17202a">Flat</text>
    <text x="150" y="272" text-anchor="middle" font-size="12" fill="#4a5a6a">slides — no grip</text>
  </g>

  <!-- edge -->
  <g>
    <line x1="355" y1="210" x2="545" y2="210" stroke="#dde5ec" stroke-width="3"/>
    <line x1="385" y1="206" x2="513" y2="139" stroke="#17202a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="385" cy="206" r="5" fill="#1a7f52"/>
    <text x="450" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#17202a">Edged</text>
    <text x="450" y="272" text-anchor="middle" font-size="12" fill="#1a7f52">grips</text>
  </g>

  <!-- hard edge -->
  <g>
    <line x1="655" y1="210" x2="845" y2="210" stroke="#dde5ec" stroke-width="3"/>
    <line x1="685" y1="206" x2="775" y2="112" stroke="#17202a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="685" cy="206" r="5" fill="#1a7f52"/>
    <text x="750" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#17202a">Hard edge</text>
    <text x="750" y="272" text-anchor="middle" font-size="12" fill="#1a7f52">brakes hard</text>
  </g>
</svg>
