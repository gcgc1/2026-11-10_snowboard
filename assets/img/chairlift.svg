<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="cl-t cl-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="cl-t">Riding the chairlift: load, sit, unload</title>
  <desc id="cl-d">Three steps. One: skate to the load sign with the front foot strapped. Two: sit down as the chair arrives and pull the bar down. Three: point the board straight and slide away at the top.</desc>

  <g fill="none" stroke="#dde5ec" stroke-width="1.5">
    <rect x="20" y="30" width="270" height="240" rx="12" fill="#f7fafc"/>
    <rect x="315" y="30" width="270" height="240" rx="12" fill="#f7fafc"/>
    <rect x="610" y="30" width="270" height="240" rx="12" fill="#f7fafc"/>
  </g>

  <!-- Step 1 -->
  <text x="155" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#17202a">1 · Skate to the load sign</text>
  <line x1="60" y1="200" x2="250" y2="200" stroke="#dde5ec" stroke-width="3"/>
  <rect x="80" y="188" width="150" height="12" rx="6" fill="#e7eef6" stroke="#17202a" stroke-width="2"/>
  <circle cx="110" cy="176" r="9" fill="#17202a"/>
  <line x1="150" y1="176" x2="120" y2="176" stroke="#1f6feb" stroke-width="2" marker-end="url(#cl-x)"/>
  <text x="155" y="236" text-anchor="middle" font-size="11.5" fill="#4a5a6a">front foot strapped, back foot pushes</text>

  <!-- Step 2 -->
  <text x="450" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#17202a">2 · Sit as the chair arrives</text>
  <line x1="450" y1="90" x2="450" y2="120" stroke="#17202a" stroke-width="3"/>
  <rect x="392" y="120" width="116" height="16" rx="6" fill="#e7eef6" stroke="#17202a" stroke-width="2.5"/>
  <rect x="500" y="96" width="10" height="44" rx="4" fill="#e7eef6" stroke="#17202a" stroke-width="2.5"/>
  <circle cx="418" cy="108" r="12" fill="#17202a"/>
  <polyline points="418,120 410,158 430,172" fill="none" stroke="#17202a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="360" y="176" width="150" height="12" rx="6" fill="#e7eef6" stroke="#17202a" stroke-width="2"/>
  <text x="450" y="236" text-anchor="middle" font-size="11.5" fill="#4a5a6a">put your back foot on the toe edge, then pull the bar down</text>

  <!-- Step 3 -->
  <text x="745" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#17202a">3 · Point straight &amp; slide off</text>
  <line x1="650" y1="196" x2="840" y2="150" stroke="#dde5ec" stroke-width="3"/>
  <g transform="rotate(-11 745 170)">
    <rect x="672" y="164" width="150" height="12" rx="6" fill="#e7eef6" stroke="#17202a" stroke-width="2"/>
  </g>
  <line x1="690" y1="120" x2="790" y2="120" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#cl-x)"/>
  <text x="740" y="112" text-anchor="middle" font-size="11.5" fill="#1f6feb">look ahead, stand up</text>
  <text x="745" y="236" text-anchor="middle" font-size="11.5" fill="#4a5a6a">nose aimed at the unload ramp; slide away straight</text>

  <defs>
    <marker id="cl-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>
</svg>
