<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="td-title td-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="td-title">The three dials of every snowboard turn: edging, pressure, and rotation</title>
  <desc id="td-desc">Left panel: a flat board slides while a board tilted onto its edge grips. Middle panel: pressure acts fore and aft along the board, across its width, and in magnitude. Right panel: rotation pivots and twists the board to steer.</desc>

  <defs>
    <marker id="td-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>

  <line x1="300" y1="26" x2="300" y2="312" stroke="#dde5ec" stroke-width="1"/>
  <line x1="600" y1="26" x2="600" y2="312" stroke="#dde5ec" stroke-width="1"/>

  <!-- ============ Panel A: Edging ============ -->
  <g>
    <text x="150" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#17202a">Edging</text>
    <text x="150" y="64" text-anchor="middle" font-size="12.5" fill="#4a5a6a">tilt the board onto its edge</text>

    <!-- flat board on the snow -->
    <line x1="40" y1="204" x2="150" y2="204" stroke="#dde5ec" stroke-width="3"/>
    <line x1="52" y1="200" x2="138" y2="200" stroke="#17202a" stroke-width="9" stroke-linecap="round"/>
    <text x="95" y="226" text-anchor="middle" font-size="12" fill="#4a5a6a">flat &#8594; slides</text>

    <!-- edged board -->
    <line x1="160" y1="204" x2="270" y2="204" stroke="#dde5ec" stroke-width="3"/>
    <line x1="172" y1="200" x2="252" y2="154" stroke="#17202a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="172" cy="200" r="4.5" fill="#1a7f52"/>
    <path d="M212,200 A40,40 0 0 0 206.7,180.1" fill="none" stroke="#1f6feb" stroke-width="1.6"/>
    <text x="238" y="192" font-size="11.5" fill="#1f6feb">edge angle</text>
    <text x="215" y="226" text-anchor="middle" font-size="12" fill="#4a5a6a">on edge &#8594; grips</text>
  </g>

  <!-- ============ Panel B: Pressure ============ -->
  <g>
    <text x="450" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#17202a">Pressure</text>
    <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#4a5a6a">how much, and where</text>

    <rect x="360" y="122" width="180" height="58" rx="10" fill="#f7fafc" stroke="#17202a" stroke-width="2.5"/>

    <!-- fore / aft -->
    <line x1="382" y1="166" x2="518" y2="166" stroke="#1f6feb" stroke-width="2" marker-start="url(#td-arrow)" marker-end="url(#td-arrow)"/>
    <text x="450" y="206" text-anchor="middle" font-size="11.5" fill="#1f6feb">fore / aft</text>

    <!-- across -->
    <line x1="450" y1="106" x2="450" y2="196" stroke="#1f6feb" stroke-width="2" marker-start="url(#td-arrow)" marker-end="url(#td-arrow)"/>
    <text x="464" y="102" font-size="11.5" fill="#1f6feb">across</text>

    <!-- magnitude -->
    <line x1="392" y1="92" x2="392" y2="118" stroke="#17202a" stroke-width="3.2" marker-end="url(#td-arrow)"/>
    <text x="392" y="84" text-anchor="middle" font-size="11.5" fill="#17202a" font-weight="600">how hard</text>
  </g>

  <!-- ============ Panel C: Rotation ============ -->
  <g>
    <text x="750" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#17202a">Rotation</text>
    <text x="750" y="64" text-anchor="middle" font-size="12.5" fill="#4a5a6a">twist the board to steer</text>

    <rect x="676" y="122" width="148" height="58" rx="10" fill="#f7fafc" stroke="#17202a" stroke-width="2.5"/>
    <path d="M750,100 A54,54 0 1 1 700,182" fill="none" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#td-arrow)"/>
    <text x="750" y="206" text-anchor="middle" font-size="11.5" fill="#1f6feb">pivot &amp; twist</text>
  </g>
</svg>
