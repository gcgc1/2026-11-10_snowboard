<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="ga-t ga-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ga-t">The garland: half-turns on a single edge</title>
  <desc id="ga-d">Top view of a slope. A dashed fall line runs down the middle. A wavy track descends, dipping toward the fall line and pulling back, but never crossing to the other edge.</desc>

  <defs>
    <marker id="ga-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="860" height="370" rx="12" fill="#f7fafc" stroke="#dde5ec" stroke-width="1.5"/>
  <text x="40" y="54" font-size="12" fill="#4a5a6a">uphill</text>
  <text x="40" y="388" font-size="12" fill="#4a5a6a">downhill</text>
  <line x1="450" y1="66" x2="450" y2="384" stroke="#4a5a6a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="450" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5a6a">fall line</text>

  <path d="M180,84 Q270,178 360,134 Q450,234 540,188 Q640,292 760,262" fill="none" stroke="#1f6feb" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ga-arrow)"/>

  <text x="300" y="168" font-size="12" fill="#1f6feb">nose leads down-slope</text>
  <text x="470" y="122" font-size="12" fill="#1f6feb">pull back across</text>

  <text x="450" y="398" text-anchor="middle" font-size="12" fill="#4a5a6a" font-style="italic">Same edge the whole way — you flatten, then re-engage. No edge change, so no edge to catch.</text>
</svg>
