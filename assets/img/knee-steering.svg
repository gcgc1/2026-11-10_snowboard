<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="ks-t ks-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ks-t">Knee steering: the front knee crosses first, the back knee follows</title>
  <desc id="ks-d">Front view of two knees over a board with levers rising from them. Left: both levers back. Right: the front lever pulls across the board and the back lever follows a beat later.</desc>

  <defs>
    <marker id="ks-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6feb"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#17202a">Pull the front knee across the board — the back knee follows a beat later</text>

  <line x1="450" y1="48" x2="450" y2="298" stroke="#dde5ec" stroke-width="1"/>

  <!-- Panel A -->
  <text x="225" y="72" text-anchor="middle" font-size="13" font-weight="650" fill="#4a5a6a">Both levers back</text>
  <rect x="70" y="250" width="310" height="16" rx="8" fill="#e7eef6" stroke="#17202a" stroke-width="2"/>
  <g stroke="#17202a" stroke-width="7" stroke-linecap="round">
    <line x1="160" y1="192" x2="138" y2="112"/>
    <line x1="290" y1="192" x2="268" y2="112"/>
  </g>
  <circle cx="160" cy="194" r="13" fill="#17202a"/>
  <circle cx="290" cy="194" r="13" fill="#17202a"/>
  <text x="160" y="286" text-anchor="middle" font-size="11.5" fill="#4a5a6a">front knee</text>
  <text x="290" y="286" text-anchor="middle" font-size="11.5" fill="#4a5a6a">back knee</text>

  <!-- Panel B -->
  <text x="675" y="72" text-anchor="middle" font-size="13" font-weight="650" fill="#4a5a6a">Front lever pulls across</text>
  <rect x="520" y="250" width="310" height="16" rx="8" fill="#e7eef6" stroke="#17202a" stroke-width="2"/>
  <g stroke="#17202a" stroke-width="7" stroke-linecap="round">
    <line x1="610" y1="192" x2="662" y2="112"/>
    <line x1="740" y1="192" x2="718" y2="112"/>
  </g>
  <circle cx="610" cy="194" r="13" fill="#1f6feb"/>
  <circle cx="740" cy="194" r="13" fill="#17202a"/>
  <path d="M600,150 A46,46 0 0 1 672,150" fill="none" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#ks-arrow)"/>
  <text x="610" y="286" text-anchor="middle" font-size="11.5" fill="#1f6feb">front knee</text>
  <text x="740" y="286" text-anchor="middle" font-size="11.5" fill="#4a5a6a">back knee</text>
</svg>
